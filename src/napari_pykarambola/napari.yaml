name: napari-pykarambola
display_name: pykarambola
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: napari-pykarambola.make_sample_data
      python_name: napari_pykarambola._sample_data:make_sample_data
      title: Load sample label image from pykarambola
    - id: napari-pykarambola.make_minkowski_widget
      python_name: napari_pykarambola._widget:MinkowskiTensorWidget
      title: Compute Minkowski tensors
  sample_data:
    - command: napari-pykarambola.make_sample_data
      display_name: pykarambola sample labels
      key: unique_id.1
  widgets:
    - command: napari-pykarambola.make_minkowski_widget
      display_name: Minkowski tensors
  menus:
    napari/layers/segment:
      - command: napari-pykarambola.make_minkowski_widget
